[package]
name = "rv-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rv-stats = { path = "../rv-stats" }
base64 = "0.23.1"
blake2 = "0.11.0"
blake3 = { version = "1", default-features = false }
aes = "0.9.3"
ctr = "0.10.1"
ml-kem = "0.3.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
md-5 = "0.11.0"
bytes = "1.12.1"
h2 = "0.4.20"
http = "1.5.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "0.11.18", default-features = false }
socket2 = "0.6.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex-lite = "0.1.9"
rv-config = { version = "0.1.0", path = "../rv-config" }
rv-net = { version = "0.1.0", path = "../rv-net" }
rv-rules = { version = "0.1.0", path = "../rv-rules" }
rv-tls = { version = "0.1.0", path = "../rv-tls" }
rv-vless = { version = "0.1.0", path = "../rv-vless" }
rv-xhttp = { version = "0.1.0", path = "../rv-xhttp" }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha3 = "0.11.0"
crc32fast = "1.5.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
tracing = "0.1.44"
ml-dsa = "0.1.1"
rv-plugin-abi = { path = "../rv-plugin-abi", optional = true }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch"], optional = true }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "async"], optional = true }
chacha20 = { version = "0.10.2", features = ["xchacha"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
plugins = ["dep:rv-plugin-abi", "dep:wasmi", "dep:smoltcp", "dep:chacha20", "dep:serde"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
wat = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(fuzzing)"] }
