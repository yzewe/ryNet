[package]
name = "rv-android"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
plugins = ["rv-core/plugins"]

[dependencies]
android_logger = { version = "0.15.1", default-features = false }
jni = "0.21"
libc = "0.2.189"
log = "0.4.34"
rv-config = { version = "0.1.0", path = "../rv-config" }
rv-core = { version = "0.1.0", path = "../rv-core" }
rv-net = { version = "0.1.0", path = "../rv-net" }
rv-host = { path = "../rv-host" }
rv-stats = { path = "../rv-stats" }
rv-tun = { version = "0.1.0", path = "../rv-tun" }
rv-tls = { version = "0.1.0", path = "../rv-tls" }
rv-vless = { version = "0.1.0", path = "../rv-vless" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tracing = { version = "0.1.44", features = ["log", "max_level_debug"] }

[lib]
name = "rynet"
crate-type = ["cdylib"]
