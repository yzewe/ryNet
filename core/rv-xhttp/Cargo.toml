[package]
name = "rv-xhttp"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rv-stats = { path = "../rv-stats" }
base64 = "0.23.1"
bytes = "1.12.1"
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip"] }
h2 = "0.4.20"
http = "1.5.0"
httparse = "1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "0.17.14"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time", "io-util", "sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
