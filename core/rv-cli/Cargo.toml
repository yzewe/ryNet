[package]
name = "rv-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
rv-config = { version = "0.1.0", path = "../rv-config" }
rv-core = { version = "0.1.0", path = "../rv-core" }
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
